<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Yahoo Fantasy Basketball | Coming Soon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px; color: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(249, 115, 22, .22), transparent 48%),
        linear-gradient(145deg, #101827, #080d16 70%);
    }
    main { width: min(760px, 100%); text-align: center; }
    .ball {
      width: 76px; height: 76px; margin: 0 auto 30px; border-radius: 50%;
      display: grid; place-items: center; font-size: 39px;
      background: #f97316; box-shadow: 0 12px 45px rgba(249,115,22,.25);
    }
    .eyebrow {
      color: #fb923c; font-size: 12px; font-weight: 800;
      letter-spacing: .22em; text-transform: uppercase;
    }
    h1 { margin: 16px 0 12px; font-size: clamp(36px, 7vw, 64px); line-height: 1.03; letter-spacing: -.045em; }
    p { margin: 0 auto; max-width: 540px; color: #aeb9c9; font-size: 17px; line-height: 1.7; }
    .rule { width: 54px; height: 3px; margin: 32px auto; border-radius: 9px; background: #f97316; }
    .note { font-size: 13px; color: #748196; }
    footer { margin-top: 72px; font-size: 12px; color: #667286; }
  </style>
</head>
<body>
  <main>
    <div class="ball" aria-hidden="true">🏀</div>
    <div class="eyebrow">A new home for historical league records</div>
    <h1>Coming Soon</h1>
    <p>
      We're building a new place to follow the league, explore team and player
      stats, and keep up with the season. Check back soon.
    </p>
    <div class="rule"></div>
    <div class="note">Yahoo Fantasy Basketball · League 86006</div>
    <footer>Independent fan project. Not affiliated with or endorsed by Yahoo.</footer>
  </main>
</body>
</html>
